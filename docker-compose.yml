version: "3.9"

services:
  llm-eval:
    build: .
    container_name: llm-eval
    volumes:
      - ./benchmarks:/app/benchmarks
      - ./examples:/app/examples
      - ./results:/app/results
    env_file:
      - .env.example
    command: ["python", "-m", "llm_eval.cli", "examples/config.yaml", "results"]

    healthcheck:
      test: ["CMD", "python", "-c", "import llm_eval; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
