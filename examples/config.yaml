dataset:
  path: benchmarks/rag_benchmark.jsonl
  format: jsonl

models:
  prediction_path: examples/model_outputs/model_a.jsonl

metrics:
  metrics:
    - bleu
    - rouge_l
    - bertscore
    - faithfulness
    - context_relevance
    - answer_relevance
  bleu_max_ngram: 4

