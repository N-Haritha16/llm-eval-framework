[project]
name = "llm-eval-framework"
version = "0.1.0"
description = "Lightweight LLM evaluation framework"
requires-python = ">=3.9"

dependencies = [
    "typer",
    "pyyaml",
    "nltk",
    "rouge-score",
    "bert-score",
    "torch>=1.0.0",
    "matplotlib",
    "fsspec<=2025.10.0",
    "uvicorn[standard]>=0.30.0",
    "fastapi>=0.115.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[project.scripts]
llm-eval = "llm_eval.cli:app"
